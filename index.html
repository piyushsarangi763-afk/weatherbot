<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weather Bot</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Arial, sans-serif; background: #e8f0fa; color: #1d2a3a; display: flex; justify-content: center; padding: 24px 16px; }
  .app { width: 100%; max-width: 460px; background: #fff; border-radius: 14px; box-shadow: 0 4px 16px rgba(0,0,0,.1); display: flex; flex-direction: column; height: calc(100vh - 48px); max-height: 680px; }
  header { padding: 16px 18px; border-bottom: 1px solid #e3e8ef; }
  header h1 { margin: 0; font-size: 20px; }
  header p { margin: 4px 0 0; font-size: 13px; color: #5a6a7e; }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 82%; padding: 10px 13px; border-radius: 14px; line-height: 1.4; font-size: 15px; white-space: pre-wrap; }
  .bot { background: #f0f3f7; align-self: flex-start; border-bottom-left-radius: 4px; }
  .me  { background: #1a73e8; color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 10px; }
  .chips button { border: 1px solid #c6d4e6; background: #fff; border-radius: 16px; padding: 6px 11px; font-size: 13px; cursor: pointer; color: #1a73e8; }
  form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid #e3e8ef; }
  input { flex: 1; padding: 11px 13px; border: 1px solid #c6d4e6; border-radius: 22px; font-size: 15px; outline: none; }
  input:focus { border-color: #1a73e8; }
  form button { background: #1a73e8; color: #fff; border: 0; border-radius: 22px; padding: 0 18px; font-size: 15px; cursor: pointer; }
  form button:disabled { opacity: .5; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>🌦️ Weather Bot</h1>
    <p>Dialogflow ES + Vercel webhook + live Open-Meteo data</p>
  </header>
  <div id="log"></div>
  <div class="chips">
    <button type="button">Weather in Bhubaneswar</button>
    <button type="button">Will it rain in Delhi tomorrow</button>
    <button type="button">How hot is it in London</button>
  </div>
  <form id="f">
    <input id="q" placeholder="Ask about the weather…" autocomplete="off">
    <button id="send">Send</button>
  </form>
</div>
<script>
  const log = document.getElementById('log');
  const q = document.getElementById('q');
  const send = document.getElementById('send');
  const sessionId = 'web-' + Math.random().toString(36).slice(2, 12);

  function add(text, who) {
    const d = document.createElement('div');
    d.className = 'msg ' + who;
    d.textContent = text;
    log.appendChild(d);
    log.scrollTop = log.scrollHeight;
    return d;
  }

  async function ask(text) {
    if (!text.trim()) return;
    add(text, 'me');
    q.value = '';
    send.disabled = true;
    const wait = add('…', 'bot');
    try {
      const r = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text, sessionId })
      });
      const data = await r.json();
      wait.textContent = data.reply;
    } catch (e) {
      wait.textContent = 'Could not reach the server. Please try again.';
    }
    send.disabled = false;
    q.focus();
  }

  document.getElementById('f').addEventListener('submit', e => { e.preventDefault(); ask(q.value); });
  document.querySelectorAll('.chips button').forEach(b => b.addEventListener('click', () => ask(b.textContent)));
  add('Hi! Ask me about the weather in any city — today or up to 7 days ahead.', 'bot');
</script>
</body>
</html>
